name: source-validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project and pinned nnU-Net source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e third_party/nnUNet
          python -m pip install -e ".[test]"
      - name: Validate shell entry points
        run: bash -n scripts/*.sh
      - name: Compile source
        run: python -m compileall -q compass_mets third_party/nnUNet/nnunetv2
      - name: Run tests
        run: python -m pytest -q
      - name: Audit public source tree
        run: python scripts/verify_release.py .
