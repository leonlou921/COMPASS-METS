[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brats-mets-microbt"
version = "1.0.0"
description = "Script-driven training and inference pipeline for BraTS-METS MicroBT"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "joblib==1.5.1",
  "lightgbm==4.6.0",
  "nibabel==5.3.3",
  "numpy==1.26.4",
  "pandas==2.3.0",
  "scikit-learn==1.7.0",
  "scipy==1.13.1",
  "SimpleITK==2.5.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["brats_mets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "third_party/nnUNet",
  # Temporary compatibility paths; removed when Task 6 migrates LCv1/LCv2.
  "inference/vendor/lcv1",
  "inference/vendor/portfolio",
  "inference/vendor/pipeline",
]
